spring:
  application:
    name: distroq
  # a bare `mvnw spring-boot:run` is a developer's laptop, not a server. Production is opted into
  # with SPRING_PROFILES_ACTIVE=production and is never arrived at by omission.
  profiles:
    default: local
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it and
      # fails startup if they do not.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    # a database that predates Flyway is recorded at V1 rather than having V1 run against it
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "existing schema from ddl-auto"
  task:
    scheduling:
      # @Scheduled tasks that must not block each other: the retry sweep, the scheduled-job sweep
      # and the recovery sweep, plus v0.8's outbox relay, reconciliation and retention cleanup.
      # ConfigurationValidator refuses to start if this drops below the number of sweeps.
      pool-size: 6
  lifecycle:
    # the whole-phase budget. distroq.shutdown.* are the per-subsystem budgets inside it.
    timeout-per-shutdown-phase: 30s

server:
  # in-flight requests finish, new ones are refused. Readiness has already gone DOWN by then.
  shutdown: graceful
  error:
    # without this the `reason` on a ResponseStatusException is dropped from the body, so a 409
    # from the replay endpoint would not say which status the job is actually in
    include-message: always
    # a stack trace in a response body names the framework versions, the package layout and often
    # the SQL. The operator gets all of it from the log line with the matching correlationId.
    include-stacktrace: never
    include-exception: false
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        # deliberately short. env, beans, configprops, threaddump and heapdump all disclose
        # configuration values, and distroq.admin.token is a configuration value.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # the indicators redact their own details; see FlywayHealthIndicator and
      # SubsystemHealthIndicator. Actuator is still an internal surface - see README.md.
      show-details: always
      group:
        liveness:
          # is the JVM up. Deliberately independent of PostgreSQL and Redis: restarting a process
          # because its database is briefly unreachable turns an outage into a restart storm.
          include: livenessState
        readiness:
          # should this instance be given work. Everything it needs in order to make progress
          # belongs here, and nothing else does.
          include: readinessState,db,redis,flyway,outboxRelay,workerSubsystem,schedulerSubsystem
  info:
    build:
      enabled: true
    git:
      mode: full
    env:
      # would publish arbitrary info.* properties straight out of the environment
      enabled: false
  metrics:
    tags:
      application: distroq

distroq:
  service:
    # filtered from the POM at build time, so the version is written down in exactly one place
    version: @project.version@
  # v0.5: only the startup migration reads this key and its three tier variants
  queue-key: distroq:jobs:pending
  delayed-key: distroq:jobs:delayed
  # user-requested execution times, kept apart from the retry set on purpose - see NOTES.md
  scheduled-key: distroq:jobs:scheduled
  # base for distroq:jobs:stream:{high,normal,low}
  stream-key: distroq:jobs:stream
  retry:
    default-max-attempts: 3
    base-delay-ms: 1000
    max-delay-ms: 60000
    jitter-factor: 0.2
    poll-interval-ms: 1000
    promote-batch-size: 100
  dlq:
    replay-attempts: 3
  priority:
    # a count of deliveries, not a duration - see NOTES.md for what this does and does not bound
    starvation-threshold: 10
  streams:
    group-name: distroq-workers
    # a random per-process suffix is appended; two instances must never share a consumer name
    consumer-name-prefix: worker
    # also the point at which a healthy but slow worker's entry looks abandoned to everyone else,
    # so it must exceed the longest expected job duration
    claim-min-idle-ms: 10000
    claim-batch-size: 100
    read-count: 1
    block-timeout-ms: 1000
    # 0 means the group starts at the beginning of the stream, not at its tail
    group-start-id: "0"
  scheduling:
    # the dominant term in scheduling latency: mean delay is half this, worst case is all of it
    poll-interval-ms: 1000
    promote-batch-size: 100
  outbox:
    poll-interval-ms: 500
    batch-size: 100
    lock-duration-ms: 30000
    # the relay budget for one operator generation; the terminal ceiling is this times
    # (operator-retry-count + 1), so a retry grants a fresh budget without erasing history
    max-attempts: 100
    dedupe-retention-ms: 604800000
    published-retention-days: 30
    # never deleted automatically; the value documents how long an operator should keep them
    failed-retention-days: 90
    cleanup-interval-ms: 3600000
    cleanup-batch-size: 500
    relay-enabled: true
    # acceptance hook: publish to Redis, then fail before PostgreSQL marks the row published.
    # Refused under the production profile.
    fail-after-publish: false
  reconciliation:
    enabled: true
    poll-interval-ms: 30000
    batch-size: 100
    stale-scheduled-after-ms: 60000
    stale-outbox-after-ms: 60000
    stale-lease-after-ms: 60000
    # the upper bound on repairs. A request may ask for less and never for more.
    auto-repair: false
    # off even when auto-repair is on: re-arming a terminal event is an operator decision
    requeue-failed-outbox: false
  effects:
    enabled: true
    stale-started-after-ms: 300000
    # a STARTED effect is ambiguous, so closing one automatically is opt-in - see NOTES.md
    auto-fail-stale: false
  admin:
    enabled: true
    # no default value anywhere. Unset means the bearer guard is inactive, which is tolerable on a
    # laptop and refused at startup under the production profile.
    token: ${DISTROQ_ADMIN_TOKEN:}
    # recorded in reliability_actions when a caller declares no X-Admin-Actor
    default-actor: admin
    max-reason-length: 500
  worker:
    concurrency: 1
    execution-lease-ms: 30000
    heartbeat-interval-ms: 5000
  shutdown:
    worker-timeout-ms: 30000
    relay-timeout-ms: 10000
    scheduler-timeout-ms: 10000
  metrics:
    job-type-tag: true
    max-job-type-tags: 20
    database-gauge-cache-ms: 5000
