spring:
  application:
    name: distroq
  datasource:
    url: jdbc:postgresql://localhost:5433/distroq
    username: distroq
    password: distroq
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      # the app runs on the host, outside the compose network
      host: localhost
      port: 6379

distroq:
  queue-key: distroq:jobs:pending
  delayed-key: distroq:jobs:delayed
  retry:
    default-max-attempts: 3
    base-delay-ms: 1000
    max-delay-ms: 60000
    jitter-factor: 0.2
    poll-interval-ms: 1000
    promote-batch-size: 100

logging:
  level:
    com.distroq: DEBUG
